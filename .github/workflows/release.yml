name: release

# Builds the downloads (tools/build_release.py, docs/RELEASE.md): this commit's app/ compiled with Nuitka into one
# native module (Phase 2; tools/compile_packages.py), the Windows launcher and installer built from source
# (release/windows-launcher, release/windows-installer) with the NodeWatch icon and version details, and the shipped
# v0.10.42 runtimes and macOS launcher. Tests them on real Windows and macOS machines (including an upgrade from
# v0.10.42) and publishes both files as a private GitHub prerelease named after the version.
on:
  push:
    branches: [main]
    paths: [app/**, docs/*.md, release/**, tools/build_release.py, tools/compile_packages.py, tools/extract_windows_payload.py, tools/launcher_parity.ps1, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-id:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.id.outputs.id }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: id
        run: |
          echo "id=$(python3 tools/build_release.py build-id)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 tools/build_release.py version)" >> "$GITHUB_OUTPUT"

  compile:
    # Phase 2 (Tier 1): the app package compiled into one native module per system (Nuitka, free edition, Python 3.12).
    needs: build-id
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Nuitka (free edition)
        shell: bash
        run: |
          python -m pip install --upgrade pip > /dev/null
          python -m pip install nuitka ordered-set zstandard
          echo "::notice title=toolchain ${{ matrix.os }}::Python $(python -c 'import sys;print(sys.version.split()[0])'), Nuitka $(python -m nuitka --version | head -n 1)"
      - name: Compile
        shell: bash
        run: python tools/compile_packages.py --build ${{ needs.build-id.outputs.id }} --out compiled
      - name: Every connector and triage backend loads from the compiled module
        shell: bash
        run: |
          python -m pip install --no-deps -q -r tests/requirements-ci.txt
          mkdir -p check/app && cp compiled/app.* check/ && cp app/launcher.py check/app/
          python -c "import shutil; shutil.copytree('app', 'check/app', dirs_exist_ok=True, ignore=shutil.ignore_patterns('*.py', '__pycache__'))"
          cd check && python -c "
          import app.integrations.connectors.sdk as s, app.services.triage.registry as r
          c, t = sorted(s.discover()), sorted(r.discover())
          print('connectors', c, s.load_failures(), 'triage', t, r.load_failures())
          assert c == ['fortigate', 'mist', 'paloalto_scm', 'panorama', 'silverpeak_orchestrator', 'snmp'] and not s.load_failures()
          assert t == ['local', 'nodewatch_server', 'shared_folder'] and not r.load_failures()
          "
      - uses: actions/upload-artifact@v4
        with:
          name: compiled-${{ runner.os }}
          path: |
            compiled/app.*
            compiled/BUILD.txt

  windows-build:
    needs: [build-id, compile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shipped installer is the recorded file
        run: echo "808d30c555e58faba5066f42593446ce09e2190563195cf5c7176fdc5be1d2b0  shipped/v0.10.42/NodeWatch-windows-installer.exe" | sha256sum -c
      - uses: actions/download-artifact@v4
        with:
          name: compiled-Windows
          path: compiled
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Icons and version details for the launcher and the installer (go-winres)
        run: |
          v=${{ needs.build-id.outputs.version }}
          for d in windows-launcher windows-installer; do
            desc="NodeWatch"; [ "$d" = windows-installer ] && desc="NodeWatch Setup"
            (cd release/$d && go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon ../resources/icon-256.png --manifest gui \
              --file-version "$v.0" --product-version "$v.0" --file-description "$desc" --product-name "NodeWatch" \
              --copyright "BWN" --original-filename "NodeWatch.exe" --out rsrc)
          done
      - name: Install terser (page-script minifier)
        run: npm install -g terser@5.36.0
      - name: Build the installer (from source, with the compiled app)
        run: |
          mkdir -p dist
          python3 tools/build_release.py windows-installer --installer shipped/v0.10.42/NodeWatch-windows-installer.exe \
            --out dist/NodeWatch.exe --build ${{ needs.build-id.outputs.id }} --compiled compiled | tee build.txt
          grep -q "page scripts minified" build.txt || { echo "::error::page scripts were not minified"; exit 1; }
          echo "::notice title=windows build::$(grep -v '^changed\|^added\|^removed  app' build.txt | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 3000)"
      - name: Build the signing tool (NodeWatch-Sign)
        run: (cd release/signing-tool && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o ../../NodeWatch-Sign.exe .)
      - uses: actions/upload-artifact@v4
        with:
          name: signing-tool
          path: NodeWatch-Sign.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  windows-test:
    needs: [build-id, windows-build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Extract the payload and verify it against its integrity.json
        shell: pwsh
        run: python tools/extract_windows_payload.py (Get-Item dist\*.exe).FullName "${{ runner.temp }}\nw"
      - name: Run the suite with the bundled Windows Python
        shell: pwsh
        run: >
          & "${{ runner.temp }}\nw\NodeWatch\_internal\runtime\python\python.exe" -B tests\run.py -v --target bundle
          --root "${{ runner.temp }}\nw\NodeWatch\_internal" --min-tests 72 --report test-result-windows.json
      - name: Report test results
        if: always()
        run: python tests/tools/annotate.py test-result-windows.json
      - name: Started from a folder other users can change (nothing installed yet), it offers the one-click install
        shell: pwsh
        run: |
          python tools/extract_windows_payload.py (Get-Item dist\*.exe).FullName "${{ runner.temp }}\shared"
          ./tools/launcher_parity.ps1 -Root "${{ runner.temp }}\shared" -Seconds 90 -ExpectWindow "Install NodeWatch"
          Get-Process NodeWatch* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: Install the shipped v0.10.42 first, so the new installer upgrades an existing install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath shipped\v0.10.42\NodeWatch-windows-installer.exe -ArgumentList "/S" -PassThru -Wait
          Write-Output "::notice title=installer::v0.10.42 installed, exit code $($p.ExitCode)"
      - name: Install silently with the new installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Get-Item dist\*.exe).FullName -ArgumentList "/S" -PassThru -Wait
          Write-Output "::notice title=installer::exit code $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter NodeWatch.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "NodeWatch" } | Select-Object -First 1
          if (-not $exe) { throw "installed NodeWatch.exe not found under $env:LOCALAPPDATA\Programs" }
          Write-Output "::notice title=installer::installed at $($exe.DirectoryName)"
          "NW_INSTALLED=$(Split-Path $exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Process NodeWatch* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: The installed launcher carries the NodeWatch icon and this version
        shell: pwsh
        run: |
          $exe = Join-Path $env:NW_INSTALLED "NodeWatch\NodeWatch.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Output "::notice title=launcher version::$($vi.ProductName) $($vi.ProductVersion) / file $($vi.FileVersion) / $($vi.LegalCopyright)"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          Write-Output "::notice title=launcher icon::$($icon.Width)x$($icon.Height)"
          if ($vi.ProductVersion -notlike "${{ needs.build-id.outputs.version }}*") { throw "launcher version is '$($vi.ProductVersion)'" }
      - name: Start the installed launcher and record what it does
        shell: pwsh
        run: ./tools/launcher_parity.ps1 -Root $env:NW_INSTALLED -Seconds 120 -ExpectBuild "${{ needs.build-id.outputs.id }}"

  upgrade:
    # An app window keeps its browser cache across upgrades. Open v0.10.42, then this build, then a second build
    # of the same commit, in one profile: each page must be its own build (no "Build mismatch"). Runs on Linux, so
    # it uses this commit's source (the compiled module is Windows-only); the page files are the same.
    needs: [build-id, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install the app's packages and a browser
        run: |
          pip install --no-deps -r tests/requirements-ci.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unpack v0.10.42, this build, and a second build of this commit
        run: |
          id=${{ needs.build-id.outputs.id }}
          next="${id:0:${#id}-10}upgradechk"
          python tools/extract_windows_payload.py shipped/v0.10.42/NodeWatch-windows-installer.exe "$RUNNER_TEMP/a" > /dev/null
          python tools/build_release.py windows-tree --installer shipped/v0.10.42/NodeWatch-windows-installer.exe --out-dir "$RUNNER_TEMP/b" --build "$id" > /dev/null
          python tools/build_release.py windows-tree --installer shipped/v0.10.42/NodeWatch-windows-installer.exe --out-dir "$RUNNER_TEMP/c" --build "$next" > /dev/null
      - name: Upgrade v0.10.42 -> this build -> next build in one browser profile
        run: |
          set -o pipefail
          python tools/upgrade_check.py "$RUNNER_TEMP/a/NodeWatch/_internal" "$RUNNER_TEMP/b/NodeWatch/_internal" | tee step1.txt
          python tools/upgrade_check.py "$RUNNER_TEMP/a/NodeWatch/_internal" "$RUNNER_TEMP/b/NodeWatch/_internal" "$RUNNER_TEMP/c/NodeWatch/_internal" | tee step2.txt
          echo "::notice title=upgrade::$(cat step2.txt | sed ':a;N;$!ba;s/\n/%0A/g')"

  macos:
    needs: [build-id, compile]
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the shipped archive is the recorded file
        run: echo "eaa8bc7e23d4323c3432dc593c21a6f48c4dbee5b5d4c2ed4f9f66b809c5fd4f  shipped/v0.10.42/NodeWatch-macos.zip" | shasum -a 256 -c
      - uses: actions/download-artifact@v4
        with:
          name: compiled-macOS
          path: compiled
      - name: Install terser (page-script minifier)
        run: npm install -g terser@5.36.0
      - name: Build the app (with the compiled app)
        run: |
          ditto -x -k shipped/v0.10.42/NodeWatch-macos.zip "$RUNNER_TEMP/build"
          python3 tools/build_release.py macos --app "$RUNNER_TEMP/build/NodeWatch.app" --build ${{ needs.build-id.outputs.id }} --compiled compiled | tee build.txt
          grep -q "page scripts minified" build.txt || { echo "::error::page scripts were not minified"; exit 1; }
          codesign --force --deep --sign - "$RUNNER_TEMP/build/NodeWatch.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/build/NodeWatch.app"
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/build/NodeWatch.app" "dist/NodeWatch.zip"
      - name: Run the suite with the bundled macOS Python
        run: |
          rm -rf "$RUNNER_TEMP/check" && ditto -x -k dist/*.zip "$RUNNER_TEMP/check"
          I="$RUNNER_TEMP/check/NodeWatch.app/Contents/Resources/_internal"
          "$I/runtime-macos/python-arm64/bin/python3.12" -B tests/run.py -v --target bundle --root "$I" --min-tests 72 --report test-result-macos.json
      - name: Report test results
        if: always()
        run: python3 tests/tools/annotate.py test-result-macos.json
      - name: Start the app and check the backend answers as this build
        run: |
          # A fresh copy: the test run above wrote bytecode into the checked copy, which the launcher would quarantine.
          rm -rf "$RUNNER_TEMP/run" && ditto -x -k dist/*.zip "$RUNNER_TEMP/run"
          APP="$RUNNER_TEMP/run/NodeWatch.app"
          "$APP/Contents/MacOS/NodeWatch" > "$RUNNER_TEMP/launcher.out" 2>&1 &
          found=""
          for i in $(seq 1 90); do
            for port in $(seq 8765 8795); do
              body=$(curl -s --max-time 1 "http://127.0.0.1:$port/api/status?probe=true" || true)
              case "$body" in *'"build"'*) found="$port $body"; break 2;; esac
            done
            sleep 1
          done
          echo "::notice title=macOS launch::${found:-no backend answered within 90 s}"
          tail -n 20 "$RUNNER_TEMP/launcher.out" | sed 's/^/launcher: /'
          for f in "$HOME/Library/Application Support/NodeWatch/logs/"*.log; do
            [ -f "$f" ] && echo "::notice title=$(basename "$f")::$(tail -n 15 "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          port=${found%% *}
          page=$(curl -s --max-time 5 "http://127.0.0.1:$port/static/core.js" | grep -o "FRONTEND_BUILD = '[^']*'" || true)
          echo "::notice title=macOS page::$page"
          pkill -f "NodeWatch.app" || true
          case "$found" in *'${{ needs.build-id.outputs.id }}'*) ;; *) echo "backend did not answer as this build"; exit 1;; esac
          case "$page" in *'${{ needs.build-id.outputs.id }}'*) ;; *) echo "page build differs from backend build"; exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  sign:
    # Your keys, stored as encrypted GitHub secrets (NodeWatch-Sign menu option 6). Without them the release is
    # published unsigned, as before.
    needs: [build-id, windows-test, macos, upgrade]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: signing-tool
          path: tool
      - name: Sign with your keys and check the result
        shell: pwsh
        env:
          NW_SIGN_PFX: ${{ secrets.NW_SIGN_PFX }}
          NW_SIGN_PFX_PASSWORD: ${{ secrets.NW_SIGN_PFX_PASSWORD }}
          NW_MINISIGN_KEY: ${{ secrets.NW_MINISIGN_KEY }}
        run: |
          trap { Write-Output ("::error title=signing failed::" + (($_ | Out-String) -replace '%','%25' -replace "`r",'' -replace "`n",'%0A')); exit 1 }
          $seen = "NW_SIGN_PFX=$([bool]$env:NW_SIGN_PFX) NW_SIGN_PFX_PASSWORD=$([bool]$env:NW_SIGN_PFX_PASSWORD) NW_MINISIGN_KEY=$([bool]$env:NW_MINISIGN_KEY)"
          if (-not $env:NW_SIGN_PFX -or -not $env:NW_SIGN_PFX_PASSWORD -or -not $env:NW_MINISIGN_KEY) {
            $asVariables = "${{ vars.NW_SIGN_PFX != '' }}/${{ vars.NW_SIGN_PFX_PASSWORD != '' }}/${{ vars.NW_MINISIGN_KEY != '' }}"
            Write-Output "::warning title=not signed::Repository secrets found: $seen. Saved as Variables instead of Secrets: $asVariables. This release is published unsigned."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "nw.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:NW_SIGN_PFX.Trim()))
          $pw = ConvertTo-SecureString -String $env:NW_SIGN_PFX_PASSWORD.Trim() -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw
          Remove-Item $pfx -Force
          $expected = (New-Object System.Security.Cryptography.X509Certificates.X509Certificate2 (Resolve-Path release\keys\BWN-NodeWatch-CodeSigning.cer)).Thumbprint
          if ($cert.Thumbprint -ne $expected) { throw "the certificate in the secret ($($cert.Thumbprint)) is not the one in release/keys ($expected)" }
          Push-Location dist
          $out = & ..\tool\NodeWatch-Sign.exe sign NodeWatch.exe NodeWatch.zip 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Output ("::notice title=sign (exit $code)::" + ($out -replace "`r",'' -replace "`n",'%0A'))
          if ($code -ne 0) { throw "signing failed" }
          foreach ($f in 'NodeWatch.exe', 'NodeWatch.zip') {
            $v = & ..\tool\NodeWatch-Sign.exe verify $f ..\release\keys\minisign.pub 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0) { throw "minisign check of ${f}: $v" }
          }
          Pop-Location
          # Check like a customer whose IT trusts your certificate: the installer and every installed program file.
          Import-Certificate -FilePath release\keys\BWN-NodeWatch-CodeSigning.cer -CertStoreLocation Cert:\LocalMachine\Root | Out-Null
          Import-Certificate -FilePath release\keys\BWN-NodeWatch-CodeSigning.cer -CertStoreLocation Cert:\LocalMachine\TrustedPublisher | Out-Null
          $s = Get-AuthenticodeSignature dist\NodeWatch.exe
          if ($s.Status -ne 'Valid') { throw "installer signature: $($s.Status)" }
          $p = Start-Process -FilePath dist\NodeWatch.exe -ArgumentList "/S" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "signed installer: silent install exit $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA "Programs\NodeWatch"
          $bad = Get-ChildItem $dir -Recurse -File | Where-Object { $_.Extension -in '.exe','.dll','.pyd' } | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($bad) { throw "not validly signed: $($bad.Name -join ', ')" }
          Write-Output "::notice title=signed::installer, every installed program file and both .minisig files check out with your keys"
      - name: The signed installer starts NodeWatch
        shell: pwsh
        env:
          NW_SIGNED: ${{ secrets.NW_MINISIGN_KEY != '' }}
        run: |
          if ($env:NW_SIGNED -ne 'true') { exit 0 }
          ./tools/launcher_parity.ps1 -Root (Join-Path $env:LOCALAPPDATA "Programs") -Seconds 120 -ExpectBuild "${{ needs.build-id.outputs.id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            dist/NodeWatch.exe
            dist/NodeWatch.zip
            dist/*.minisig

  publish:
    needs: [build-id, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: dist
      - name: Publish a private prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ls -l
          names="$(ls | sort | tr '\n' ' ')"
          case "$names" in
            "NodeWatch.exe NodeWatch.exe.minisig NodeWatch.zip NodeWatch.zip.minisig ")
              notes="Signed with your keys: Windows code signature on the installer and every program file inside, and minisign signatures (.minisig) for both downloads. Check with: minisign -Vm NodeWatch.exe -p minisign.pub" ;;
            "NodeWatch.exe NodeWatch.zip ")
              notes="Not signed (the signing secrets are not set). Windows SmartScreen and macOS Gatekeeper will warn." ;;
            *) echo "::error::unexpected files: $names"; exit 1 ;;
          esac
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "v${{ needs.build-id.outputs.version }}-${{ github.sha }}" * --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --prerelease --title "NodeWatch v${{ needs.build-id.outputs.version }} (build ${{ needs.build-id.outputs.id }})" \
            --notes "NodeWatch v${{ needs.build-id.outputs.version }}, built from commit ${{ github.sha }}. The app code ships compiled. $notes macOS keeps its ad-hoc Apple signature (Apple signing is not free). Tested on GitHub Windows and macOS runners before publishing."
