name: release

# Builds the downloads (tools/build_release.py, docs/RELEASE.md): this commit's app/ source, the Windows launcher
# compiled from release/windows-launcher with the NodeWatch icon and version details, and the shipped v0.10.42
# programs that have no source here. Tests them on real Windows and macOS machines (including an upgrade from
# v0.10.42) and publishes both files as a private GitHub prerelease named after the version.
on:
  push:
    branches: [main]
    paths: [app/**, docs/*.md, release/**, tools/build_release.py, tools/extract_windows_payload.py, tools/launcher_parity.ps1, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-id:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.id.outputs.id }}
      version: ${{ steps.id.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: id
        run: |
          echo "id=$(python3 tools/build_release.py build-id)" >> "$GITHUB_OUTPUT"
          echo "version=$(python3 tools/build_release.py version)" >> "$GITHUB_OUTPUT"

  windows-build:
    needs: build-id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the shipped installer is the recorded file
        run: echo "808d30c555e58faba5066f42593446ce09e2190563195cf5c7176fdc5be1d2b0  shipped/v0.10.42/NodeWatch-windows-installer.exe" | sha256sum -c
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Icon and version details for the launcher (go-winres)
        run: |
          v=${{ needs.build-id.outputs.version }}
          cd release/windows-launcher
          note() { echo "::notice title=$1::$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' "$2" | head -c 3500)"; }
          go list -m -versions github.com/tc-hib/go-winres > versions.txt 2>&1 || true
          note "go-winres versions" versions.txt
          if ! go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon ../resources/icon-256.png --manifest gui \
            --file-version "$v.0" --product-version "$v.0" --file-description "NodeWatch" --product-name "NodeWatch" \
            --company-name "BWN" --copyright "BWN" --original-filename "NodeWatch.exe" --out rsrc > winres.txt 2>&1; then
            note "go-winres failed" winres.txt
            go run github.com/tc-hib/go-winres@v0.3.3 help simply > help.txt 2>&1 || true
            note "go-winres help" help.txt
            exit 1
          fi
          rm -f versions.txt winres.txt
          ls -l *.syso
      - name: Build the installer
        run: |
          mkdir -p dist
          python3 tools/build_release.py windows --installer shipped/v0.10.42/NodeWatch-windows-installer.exe \
            --out dist/NodeWatch.exe --build ${{ needs.build-id.outputs.id }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/

  windows-test:
    needs: [build-id, windows-build]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Extract the payload and verify it against its integrity.json
        shell: pwsh
        run: python tools/extract_windows_payload.py (Get-Item dist\*.exe).FullName "${{ runner.temp }}\nw"
      - name: Run the suite with the bundled Windows Python
        shell: pwsh
        run: >
          & "${{ runner.temp }}\nw\NodeWatch\_internal\runtime\python\python.exe" tests\run.py -v --target bundle
          --root "${{ runner.temp }}\nw\NodeWatch\_internal" --min-tests 69 --report test-result-windows.json
      - name: Report test results
        if: always()
        run: python tests/tools/annotate.py test-result-windows.json
      - name: Install the shipped v0.10.42 first, so the new installer upgrades an existing install
        shell: pwsh
        run: |
          $p = Start-Process -FilePath shipped\v0.10.42\NodeWatch-windows-installer.exe -ArgumentList "/S" -PassThru -Wait
          Write-Output "::notice title=installer::v0.10.42 installed, exit code $($p.ExitCode)"
      - name: Install silently with the new installer
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Get-Item dist\*.exe).FullName -ArgumentList "/S" -PassThru -Wait
          Write-Output "::notice title=installer::exit code $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter NodeWatch.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq "NodeWatch" } | Select-Object -First 1
          if (-not $exe) { throw "installed NodeWatch.exe not found under $env:LOCALAPPDATA\Programs" }
          Write-Output "::notice title=installer::installed at $($exe.DirectoryName)"
          "NW_INSTALLED=$(Split-Path $exe.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Process NodeWatch* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
      - name: The installed launcher carries the NodeWatch icon and this version
        shell: pwsh
        run: |
          $exe = Join-Path $env:NW_INSTALLED "NodeWatch\NodeWatch.exe"
          $vi = (Get-Item $exe).VersionInfo
          Write-Output "::notice title=launcher version::$($vi.ProductName) $($vi.ProductVersion) / file $($vi.FileVersion) / $($vi.CompanyName)"
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          Write-Output "::notice title=launcher icon::$($icon.Width)x$($icon.Height)"
          if ($vi.ProductVersion -notlike "${{ needs.build-id.outputs.version }}*") { throw "launcher version is '$($vi.ProductVersion)'" }
      - name: Start the installed launcher and record what it does
        shell: pwsh
        run: ./tools/launcher_parity.ps1 -Root $env:NW_INSTALLED -Seconds 120 -ExpectBuild "${{ needs.build-id.outputs.id }}"
      - name: Started from a folder other users can change, it offers the one-click install
        shell: pwsh
        run: |
          Get-Process NodeWatch* -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          ./tools/launcher_parity.ps1 -Root "${{ runner.temp }}\nw" -Seconds 90 -ExpectWindow "Install NodeWatch"

  upgrade:
    # An app window keeps its browser cache across upgrades. Open v0.10.42, then this build, then a second build
    # of the same commit, in one profile: each page must be its own build (no "Build mismatch").
    needs: [build-id, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.7"
          cache: false
      - name: Install the app's packages and a browser
        run: |
          pip install --no-deps -r tests/requirements-ci.txt
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Unpack v0.10.42, this build, and a second build of this commit
        run: |
          id=${{ needs.build-id.outputs.id }}
          next="${id:0:${#id}-10}upgradechk"
          python tools/build_release.py windows --installer shipped/v0.10.42/NodeWatch-windows-installer.exe --out next.exe --build "$next" > /dev/null
          python tools/extract_windows_payload.py shipped/v0.10.42/NodeWatch-windows-installer.exe "$RUNNER_TEMP/a" > /dev/null
          python tools/extract_windows_payload.py dist/NodeWatch.exe "$RUNNER_TEMP/b" > /dev/null
          python tools/extract_windows_payload.py next.exe "$RUNNER_TEMP/c" > /dev/null
      - name: Upgrade v0.10.42 -> this build -> next build in one browser profile
        run: |
          set -o pipefail
          python tools/upgrade_check.py "$RUNNER_TEMP/a/NodeWatch/_internal" "$RUNNER_TEMP/b/NodeWatch/_internal" | tee step1.txt
          python tools/upgrade_check.py "$RUNNER_TEMP/a/NodeWatch/_internal" "$RUNNER_TEMP/b/NodeWatch/_internal" "$RUNNER_TEMP/c/NodeWatch/_internal" | tee step2.txt
          echo "::notice title=upgrade::$(cat step2.txt | sed ':a;N;$!ba;s/\n/%0A/g')"

  macos:
    needs: build-id
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check the shipped archive is the recorded file
        run: echo "eaa8bc7e23d4323c3432dc593c21a6f48c4dbee5b5d4c2ed4f9f66b809c5fd4f  shipped/v0.10.42/NodeWatch-macos.zip" | shasum -a 256 -c
      - name: Build the app
        run: |
          ditto -x -k shipped/v0.10.42/NodeWatch-macos.zip "$RUNNER_TEMP/build"
          python3 tools/build_release.py macos --app "$RUNNER_TEMP/build/NodeWatch.app" --build ${{ needs.build-id.outputs.id }}
          codesign --force --deep --sign - "$RUNNER_TEMP/build/NodeWatch.app"
          codesign --verify --deep --strict --verbose=2 "$RUNNER_TEMP/build/NodeWatch.app"
          mkdir -p dist
          ditto -c -k --keepParent "$RUNNER_TEMP/build/NodeWatch.app" "dist/NodeWatch.zip"
      - name: Run the suite with the bundled macOS Python
        run: |
          rm -rf "$RUNNER_TEMP/check" && ditto -x -k dist/*.zip "$RUNNER_TEMP/check"
          I="$RUNNER_TEMP/check/NodeWatch.app/Contents/Resources/_internal"
          "$I/runtime-macos/python-arm64/bin/python3.12" tests/run.py -v --target bundle --root "$I" --min-tests 69 --report test-result-macos.json
      - name: Report test results
        if: always()
        run: python3 tests/tools/annotate.py test-result-macos.json
      - name: Start the app and check the backend answers as this build
        run: |
          # A fresh copy: the test run above wrote bytecode into the checked copy, which the launcher would quarantine.
          rm -rf "$RUNNER_TEMP/run" && ditto -x -k dist/*.zip "$RUNNER_TEMP/run"
          APP="$RUNNER_TEMP/run/NodeWatch.app"
          "$APP/Contents/MacOS/NodeWatch" > "$RUNNER_TEMP/launcher.out" 2>&1 &
          found=""
          for i in $(seq 1 90); do
            for port in $(seq 8765 8795); do
              body=$(curl -s --max-time 1 "http://127.0.0.1:$port/api/status?probe=true" || true)
              case "$body" in *'"build"'*) found="$port $body"; break 2;; esac
            done
            sleep 1
          done
          echo "::notice title=macOS launch::${found:-no backend answered within 90 s}"
          tail -n 20 "$RUNNER_TEMP/launcher.out" | sed 's/^/launcher: /'
          for f in "$HOME/Library/Application Support/NodeWatch/logs/"*.log; do
            [ -f "$f" ] && echo "::notice title=$(basename "$f")::$(tail -n 15 "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          pkill -f "NodeWatch.app" || true
          case "$found" in *'${{ needs.build-id.outputs.id }}'*) ;; *) echo "backend did not answer as this build"; exit 1;; esac
          port=${found%% *}
          page=$(curl -s --max-time 5 "http://127.0.0.1:$port/static/core.js" | grep -o "FRONTEND_BUILD = '[^']*'" || true)
          echo "::notice title=macOS page::$page"
          case "$page" in *'${{ needs.build-id.outputs.id }}'*) ;; *) echo "page build differs from backend build"; exit 1;; esac
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/

  publish:
    needs: [build-id, windows-test, macos, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a private prerelease with both downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "v${{ needs.build-id.outputs.version }}-${{ github.sha }}" * --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --prerelease --title "NodeWatch v${{ needs.build-id.outputs.version }} (build ${{ needs.build-id.outputs.id }})" \
            --notes "NodeWatch v${{ needs.build-id.outputs.version }}, built from commit ${{ github.sha }}. Not code-signed yet (Windows SmartScreen and macOS Gatekeeper will warn). Tested on GitHub Windows and macOS runners before publishing."
