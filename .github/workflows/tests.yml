name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the shipped package versions
        run: python -m pip install --no-deps -r tests/requirements-ci.txt
      - name: Run the test suite (source target)
        run: python tests/run.py -v --report test-result.json
      - name: Show failures as annotations
        if: failure()
        run: |
          python - <<'PY'
          import json
          r = json.load(open("test-result.json"))
          print(f"run={r['run']} failures={len(r['failures'])} errors={len(r['errors'])}")
          for d in r.get("details", [])[:40]:
              last = [l for l in d["traceback"].strip().splitlines() if l.strip()][-3:]
              msg = " | ".join(x.strip() for x in last).replace("%", "%25").replace("\n", " ")
              print(f"::error title={d['kind']}: {d['test']}::{msg[:900]}")
          PY
      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.json
