name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the shipped package versions
        run: python -m pip install --no-deps -r tests/requirements-ci.txt
      - name: Run the test suite (source target)
        run: python tests/run.py -v --min-tests 62 --report test-result.json
      - name: Report results as annotations
        if: always()
        run: python tests/tools/annotate.py test-result.json
      - name: Keep the result file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-result
          path: test-result.json
