name: intel-mac

# Phase 0 Intel-Mac step: run the published macOS app on a real Intel Mac (macos-13 is x86_64) and record what
# the launcher does. The shipped macOS launcher has no source here, so this first establishes, empirically, whether
# it even looks for an x86_64 runtime — which decides whether Intel support is "drop in an x86_64 runtime" or is
# blocked on the launcher. It changes nothing; it only observes and reports.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: macos-13
    timeout-minutes: 15
    steps:
      - name: Confirm this runner is Intel
        run: |
          echo "arch: $(uname -m)"   # expect x86_64
          sysctl -n machdep.cpu.brand_string || true
      - name: Download the newest NodeWatch macOS app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName \
                 -q '[.[]|select(.tagName|startswith("v0."))][0].tagName')
          echo "tag=$tag"
          gh release download "$tag" --repo "${{ github.repository }}" --pattern NodeWatch.zip --dir dl
      - name: Launch it and record what happens
        run: |
          ditto -x -k dl/NodeWatch.zip "$RUNNER_TEMP/app"
          APP="$RUNNER_TEMP/app/NodeWatch.app"
          echo "launcher arches: $(lipo -archs "$APP/Contents/MacOS/NodeWatch" 2>/dev/null || echo unknown)"
          echo "runtime dirs present:"; ls "$APP/Contents/Resources/_internal/runtime-macos" 2>/dev/null || true
          echo "compiled module arches: $(lipo -archs "$APP/Contents/Resources/_internal/app.cpython-312-darwin.so" 2>/dev/null || echo unknown)"
          "$APP/Contents/MacOS/NodeWatch" > "$RUNNER_TEMP/out.txt" 2>&1 &
          answered=""
          for i in $(seq 1 45); do
            for port in $(seq 8765 8770); do
              body=$(curl -s --max-time 1 "http://127.0.0.1:$port/api/status?probe=true" || true)
              case "$body" in *'"build"'*) answered="$port $body"; break 2;; esac
            done
            sleep 1
          done
          echo "::notice title=intel launch::${answered:-no backend answered on Intel within 45s}"
          pkill -f "NodeWatch.app" || true
          echo "=== launcher stdout/stderr ==="; tail -n 30 "$RUNNER_TEMP/out.txt" || true
          for f in "$HOME/Library/Application Support/NodeWatch/logs/"*.log; do
            [ -f "$f" ] && echo "::notice title=$(basename "$f")::$(tail -n 25 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' | head -c 3500)"
          done
          # This job only observes; it does not fail if Intel cannot run the arm64 app (that is the finding).
          echo "observation complete"
